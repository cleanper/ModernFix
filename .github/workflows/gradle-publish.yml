name: Gradle Build & Publish

on:
  release:
    types: [created]
  push:
    branches: ['**']
  workflow_dispatch:

env:
  PROJECT_VERSION: '1.20'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false

    - name: Build and Publish
      run: |
        ./gradlew build publish -Pversion=${{ env.PROJECT_VERSION }} --no-daemon --stacktrace --continue || true
        mkdir -p ${{ runner.temp }}/output
        find . -name "*.jar" -exec cp {} ${{ runner.temp }}/output \;
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create full project archive
      run: |
        zip -r ${{ runner.temp }}/project_source_${{ env.PROJECT_VERSION }}.zip . -x '*.git*' '*.gradle*' 'build/*'

    - name: Upload JAR artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar_artifacts_${{ env.PROJECT_VERSION }}
        path: ${{ runner.temp }}/output/*.jar
        retention-days: 0

    - name: Upload project archive
      uses: actions/upload-artifact@v4
      with:
        name: project_source_${{ env.PROJECT_VERSION }}
        path: ${{ runner.temp }}/project_source_${{ env.PROJECT_VERSION }}.zip
        retention-days: 3
        
